name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Artifact (with permissions)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}
          key: artifacts-${{ github.run_id }}-${{ github.run_number }}-php${{ matrix.php-version }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: symfony, composer:v2
          extensions: gd,json,iconv,intl,mbstring,pdo,pdo_mysql,xml,zip,curl,apcu

      - name: Install Composer dependencies
        run: |
          composer validate --no-check-publish
          composer update --prefer-dist --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup build
        run: |
          rm -Rf .git/

  security:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Artifact (with permissions)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}
          key: artifacts-${{ github.run_id }}-${{ github.run_number }}-php${{ matrix.php-version }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: symfony
          extensions: gd,json,iconv,intl,mbstring,pdo,pdo_mysql,xml,zip,curl,apcu

      - name: Security checker
        run: symfony check:security

  coding-standards:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Artifact (with permissions)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}
          key: artifacts-${{ github.run_id }}-${{ github.run_number }}-php8.4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: symfony
          extensions: gd,json,iconv,intl,mbstring,pdo,pdo_mysql,xml,zip,curl,apcu

      - name: Run php_codesniffer with PSR12 standard
        run: composer cs

      - name: Run PHPStan
        run: composer stan

      - name: Run PHP Insights
        run: composer insight

  tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Artifact (with permissions)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}
          key: artifacts-${{ github.run_id }}-${{ github.run_number }}-php${{ matrix.php-version }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: symfony
          extensions: gd,json,iconv,intl,mbstring,pdo,pdo_mysql,xml,zip,curl,apcu
          coverage: xdebug

      - name: All Tests (unit & functional)
        run: composer test

      - name: Publish coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: coverage

  integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php-version: '8.2'
            symfony-version: '7.2'
          - php-version: '8.4'
            symfony-version: '8.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: bundle

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: symfony, composer:v2
          extensions: gd,json,iconv,intl,mbstring,pdo,pdo_sqlite,xml,zip,curl,apcu

      - name: Create Symfony project
        run: |
          composer create-project symfony/skeleton:${{ matrix.symfony-version }}.* test-app --no-interaction
          cd test-app
          composer require webapp --no-interaction

      - name: Install bundle from local path
        run: |
          cd test-app
          composer config repositories.local '{"type": "path", "url": "../bundle", "options": {"symlink": true}}'
          composer require enabel/partner-countries-bundle:@dev --no-interaction

      - name: Verify bundle is registered
        run: |
          cd test-app
          php bin/console debug:container --env=dev | grep -i "partner" || echo "Bundle services check"
          php bin/console debug:config enabel_partner_countries --env=dev
